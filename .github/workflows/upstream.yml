name: Odoo upstream

# Weekly: fail when Odoo changes safe_eval / eval contexts (re-run tools/sync_odoo.py), and
# lint every server action shipped with Odoo Community as a false-positive regression check.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["17.0", "saas-17.1", "saas-17.2", "saas-17.3", "saas-17.4",
                 "18.0", "saas-18.1", "saas-18.2", "saas-18.3", "saas-18.4",
                 "19.0", "saas-19.1", "saas-19.2", "saas-19.3", "saas-19.4", "20.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # 20.0 sources use 3.12 syntax; the sandbox needs 3.12+
      - run: pip install '.[test]'  # python-dateutil: saas-17.3 exposes dateutil's __all__
      - name: Extracted data still matches odoo/odoo@${{ matrix.branch }}
        run: python tools/sync_odoo.py --check --src-root "$RUNNER_TEMP" ${{ matrix.branch }}
      - name: No findings on Odoo's own server actions
        run: |
          src="$RUNNER_TEMP/src-${{ matrix.branch }}"
          git -C "$src" sparse-checkout add '/addons/*/__manifest__.py' '/addons/*/data/*.xml' '/addons/*/views/*.xml' \
            '/addons/*/wizard/*.xml' '/addons/*/wizards/*.xml' '/addons/*/report/*.xml' \
            '/odoo/addons/base/data/*.xml' '/odoo/addons/base/views/*.xml' '/odoo/addons/base/wizard/*.xml'
          sevlint check "$src/addons" "$src/odoo/addons" --odoo ${{ matrix.branch }} --strict
